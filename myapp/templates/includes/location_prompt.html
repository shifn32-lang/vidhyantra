<style>
.one-location-card{position:fixed;right:22px;bottom:22px;z-index:12000;width:min(390px,calc(100vw - 28px));padding:18px;background:var(--surface,#fff);color:var(--head,#172033);border:1px solid var(--line,#e4e7ed);border-radius:18px;box-shadow:0 18px 55px rgba(20,28,45,.22);font-family:var(--font-body,'DM Sans',Arial,sans-serif)}
.one-location-card[hidden]{display:none!important}
.one-location-top{display:flex;align-items:flex-start;gap:12px}
.one-location-icon{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:13px;background:var(--tint,#fff0f2);color:var(--red,#e8001e);font-size:18px}
.one-location-copy h2{margin:0 0 5px;font:800 16px/1.25 var(--font-head,'Sora','DM Sans',Arial,sans-serif);color:var(--head,#111827)}
.one-location-copy p{margin:0;color:var(--text,#5d6678);font-size:13px;line-height:1.45}
.one-location-note{display:flex;align-items:center;gap:6px;margin:11px 0 0;color:var(--text,#697386);font-size:11px}
.one-location-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}
.one-location-btn{border:0;border-radius:10px;padding:10px 13px;font:700 12px/1 var(--font-body,'DM Sans',Arial,sans-serif);cursor:pointer}
.one-location-btn:disabled{opacity:.58;cursor:wait}
.one-location-no{background:var(--bg-alt,#f0f2f6);color:var(--head,#3d4657)}
.one-location-yes{background:var(--red,#e8001e);color:#fff}
.one-location-status{min-height:16px;margin:10px 0 0;color:var(--red,#b42318);font-size:11px;text-align:right}
@media(max-width:520px){.one-location-card{right:14px;bottom:14px}.one-location-actions{flex-direction:column-reverse}.one-location-btn{width:100%;padding:12px}}
</style>

<section
  class="one-location-card"
  id="oneLocationPrompt"
  data-auto-open="{% if show_location_prompt %}1{% else %}0{% endif %}"
  role="dialog"
  aria-labelledby="oneLocationTitle"
  aria-describedby="oneLocationDescription"
  hidden
>
  <div class="one-location-top">
    <div class="one-location-icon"><i class="fas fa-location-dot" aria-hidden="true"></i></div>
    <div class="one-location-copy">
      <h2 id="oneLocationTitle">Enable location?</h2>
      <p id="oneLocationDescription">For more accurate local results, allow EduTrellis to use your current location one time.</p>
      <div class="one-location-note"><i class="fas fa-shield-halved" aria-hidden="true"></i> One reading only. No continuous or background tracking.</div>
    </div>
  </div>
  <div class="one-location-actions">
    <button type="button" class="one-location-btn one-location-no" id="oneLocationNo">Not now</button>
    <button type="button" class="one-location-btn one-location-yes" id="oneLocationYes"><i class="fas fa-location-crosshairs" aria-hidden="true"></i> Enable one-time access</button>
  </div>
  <p class="one-location-status" id="oneLocationStatus" role="status" aria-live="polite"></p>
</section>

<script>
(function(){
  var card = document.getElementById('oneLocationPrompt');
  var allowButton = document.getElementById('oneLocationYes');
  var declineButton = document.getElementById('oneLocationNo');
  var status = document.getElementById('oneLocationStatus');
  if (!card || !allowButton || !declineButton) return;

  function csrfToken(){
    var match = document.cookie.match(/(?:^|;\s*)csrftoken=([^;]+)/);
    return match ? decodeURIComponent(match[1]) : '';
  }
  function setBusy(busy){
    allowButton.disabled = busy;
    declineButton.disabled = busy;
  }
  function saveChoice(payload){
    return fetch('{% url "ai_location_update" %}', {
      method: 'POST',
      credentials: 'same-origin',
      headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrfToken()},
      body: JSON.stringify(payload)
    }).then(function(response){
      return response.json().then(function(body){
        if (!response.ok) throw new Error(body.detail || 'Could not save your choice.');
        return body;
      });
    });
  }
  // Optional per-open completion callback — set by whoever opened the
  // card (see includes/profile_wizard.html step 3, which reuses this same
  // card for its own location step and needs to know when it's done,
  // whichever way the user resolved it: allow, decline, or an error).
  var activeOnDone = null;
  function closeCard(){
    card.hidden = true;
    var cb = activeOnDone;
    activeOnDone = null;
    if (cb) cb();
  }
  window.showOneTimeLocationPrompt = function(onDone){
    status.textContent = '';
    setBusy(false);
    activeOnDone = (typeof onDone === 'function') ? onDone : null;
    card.hidden = false;
  };

  declineButton.addEventListener('click', function(){
    setBusy(true);
    status.textContent = 'Saving your choice…';
    saveChoice({consent: 'denied'}).then(closeCard).catch(function(error){
      setBusy(false);
      status.textContent = error.message;
    });
  });

  allowButton.addEventListener('click', function(){
    if (!window.isSecureContext || !navigator.geolocation) {
      status.textContent = 'Location access needs HTTPS and a supported browser.';
      return;
    }
    setBusy(true);
    status.textContent = 'Waiting for your browser…';
    navigator.geolocation.getCurrentPosition(function(position){
      status.textContent = 'Saving location…';
      saveChoice({
        consent: 'granted',
        latitude: position.coords.latitude,
        longitude: position.coords.longitude,
        accuracy: position.coords.accuracy || 0
      }).then(closeCard).catch(function(error){
        setBusy(false);
        status.textContent = error.message;
      });
    }, function(error){
      if (error && error.code === 1) {
        saveChoice({consent: 'denied'}).then(closeCard).catch(function(saveError){
          setBusy(false);
          status.textContent = saveError.message;
        });
        return;
      }
      setBusy(false);
      status.textContent = 'Your location was unavailable. Please try again.';
    }, {enableHighAccuracy: false, timeout: 10000, maximumAge: 0});
  });

  // window.__skipAutoLocationPrompt lets includes/profile_wizard.html claim
  // this page load for itself (it opens this same card as its own step 3)
  // without a redundant second auto-open of the plain card underneath it.
  if (card.getAttribute('data-auto-open') === '1') {
    window.setTimeout(function(){
      if (window.__skipAutoLocationPrompt) return;
      window.showOneTimeLocationPrompt();
    }, 700);
  }
})();
</script>
